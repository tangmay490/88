<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>สตูดิโอวาดรูป | Drawing Studio</title>

  <!-- ===== PWA: manifest, ไอคอน, สีธีม ===== -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b3654" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="วาดรูป" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ แถบเครื่องมือด้านซ้าย ============ -->
    <aside class="toolrail">
      <h1 class="brand">สตูดิโอ<span>วาดรูป</span></h1>

      <section class="tool-group" aria-label="เลือกเครื่องมือ">
        <p class="group-label">เครื่องมือ</p>
        <div class="tool-grid">
          <button class="tool-btn active" data-tool="pen"      title="ปากกา (P)">
            <svg viewBox="0 0 24 24"><path d="M3 21l3.6-1 11-11-2.6-2.6-11 11L3 21zM17 3.3l3.7 3.7L18.7 9 15 5.3z"/></svg>
            <span>ปากกา</span>
          </button>
          <button class="tool-btn" data-tool="pencil"   title="ดินสอ (N)">
            <svg viewBox="0 0 24 24" fill="none"><line x1="4" y1="20" x2="16" y2="8" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.7" fill="currentColor" stroke="none"/></svg>
            <span>ดินสอ</span>
          </button>
          <button class="tool-btn" data-tool="brush"    title="พู่กัน (B)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 19c3-1 4-3 4-6 3 0 5-2 5-5l5-5" stroke-width="3" stroke-linecap="round"/></svg>
            <span>พู่กัน</span>
          </button>
          <button class="tool-btn" data-tool="marker"   title="มาร์กเกอร์ (M)">
            <svg viewBox="0 0 24 24" fill="none"><line x1="5" y1="19" x2="19" y2="5" stroke-width="6" stroke-linecap="square"/></svg>
            <span>มาร์กเกอร์</span>
          </button>
          <button class="tool-btn" data-tool="magic"    title="เมจิก (G)">
            <svg viewBox="0 0 24 24"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4z"/></svg>
            <span>เมจิก</span>
          </button>
          <button class="tool-btn" data-tool="eraser"   title="ยางลบ (E)">
            <svg viewBox="0 0 24 24"><path d="M16.2 3.3L21 8.1c.4.4.4 1 0 1.4l-8.5 8.5H7l-4-4c-.4-.4-.4-1 0-1.4l11.8-9.3c.4-.4 1-.4 1.4 0z"/></svg>
            <span>ยางลบ</span>
          </button>
          <button class="tool-btn" data-tool="line"     title="เส้นตรง (L)">
            <svg viewBox="0 0 24 24"><path d="M4 20L20 4" stroke-width="2" fill="none"/></svg>
            <span>เส้นตรง</span>
          </button>
          <button class="tool-btn" data-tool="rect"     title="สี่เหลี่ยม (R)">
            <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" fill="none" stroke-width="2"/></svg>
            <span>สี่เหลี่ยม</span>
          </button>
          <button class="tool-btn" data-tool="ellipse"  title="วงรี (O)">
            <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6" fill="none" stroke-width="2"/></svg>
            <span>วงรี</span>
          </button>
        </div>
      </section>

      <section class="tool-group">
        <p class="group-label">สี</p>
        <input type="color" id="colorPicker" value="#2b2a28" />
        <div class="swatches" id="swatches"></div>
      </section>

      <section class="tool-group">
        <p class="group-label">ผสมสีเอง</p>
        <div class="mixer-row">
          <input type="color" id="mixA" value="#3e5c76" title="สีที่ 1" />
          <input type="range" id="mixRatio" min="0" max="100" value="50" title="สัดส่วนการผสม" />
          <input type="color" id="mixB" value="#c1502e" title="สีที่ 2" />
        </div>
        <div class="mixer-preview-row">
          <div class="mixer-preview" id="mixPreview"></div>
          <button id="useMixBtn" class="ghost-btn">ใช้สีนี้</button>
        </div>
      </section>

      <section class="tool-group">
        <p class="group-label">ขนาดหัวแปรง — <span id="sizeValue">6</span>px</p>
        <input type="range" id="sizeSlider" min="1" max="60" value="6" />
      </section>

      <section class="tool-group actions">
        <button id="undoBtn"  class="ghost-btn" title="ย้อนกลับ (Ctrl+Z)">↶ ย้อนกลับ</button>
        <button id="redoBtn"  class="ghost-btn" title="ทำซ้ำ (Ctrl+Y)">↷ ทำซ้ำ</button>
        <button id="clearBtn" class="ghost-btn danger">ล้างทั้งหมด</button>
        <button id="saveBtn"  class="primary-btn">บันทึกเป็นรูปภาพ</button>
        <button id="installBtn" class="ghost-btn" hidden>⬇ ติดตั้งแอป</button>
      </section>

      <p class="hint">ลาก/แตะบนผืนผ้าใบเพื่อวาด • เครื่องมือรูปทรงจะแสดงตัวอย่างก่อนปล่อย</p>
    </aside>

    <!-- ============ พื้นที่วาดรูป ============ -->
    <main class="canvas-wrap">
      <div class="canvas-stack" id="canvasStack">
        <canvas id="baseCanvas"></canvas>
        <canvas id="previewCanvas"></canvas>
      </div>
    </main>
  </div>

  <!-- โหลดตามลำดับ: history -> tools -> canvas -> main -> pwa -->
  <script src="js/history.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
